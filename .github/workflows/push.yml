name: 每日寓言推送

on:
  schedule:
    # GitHub 的 schedule 是尽力而为调度，且高负载时会大量丢弃事件（实测存活率极低）。
    # 策略：*/15 常规触发 + 档期窗口内多条错峰触发（北京时间 12:00-14:00 窗口），
    # 多一条 cron 就多一次命中窗口的机会；是否真正推送由 scripts/main.py 统一判断
    # （SLOT_TIMES 默认 12:00，窗口默认 120 分钟，当日该档已推送则秒级退出）。
    - cron: '*/15 * * * *'
    - cron: '13 4 * * *'   # 北京 12:13
    - cron: '31 4 * * *'   # 北京 12:31
    - cron: '49 4 * * *'   # 北京 12:49
    - cron: '17 5 * * *'   # 北京 13:17
    - cron: '43 5 * * *'   # 北京 13:43
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fable-push
  cancel-in-progress: false

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成故事并推送
        env:
          # ---- LLM（未配置 LLM_API_KEY 时自动改用 stories/pregenerated 预生成库）----
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_TEMPERATURE: ${{ secrets.LLM_TEMPERATURE }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS }}
          LLM_TIMEOUT: ${{ secrets.LLM_TIMEOUT }}
          LLM_MAX_RETRIES: ${{ secrets.LLM_MAX_RETRIES }}
          # ---- 调度：北京时间，默认每天 12:00；0 或不填表示错过后持续补发 ----
          SLOT_TIMES: ${{ secrets.SLOT_TIMES }}
          SLOT_WINDOW_MINUTES: ${{ secrets.SLOT_WINDOW_MINUTES }}
          # ---- 推送渠道：逗号分隔，可选 serverchan/pushplus/bark/telegram/wecom/dingtalk/feishu/mail ----
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python scripts/main.py

      - name: 提交故事与状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories state
          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "寓言推送 $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
            git push
          fi
