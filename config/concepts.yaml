# 公务员寓言推送 · 概念库
# 每个概念字段：id（唯一英文标识）、名称、学科、难度（基础/进阶/研究生）、
#   一句话定义 one_liner、核心要点 key_points、公务员考试关联 exam_relevance、
#   常见误解 misconception、隐喻设计建议 metaphor_hint。
# 新增概念请照抄字段结构，id 不得与现有重复。

concepts:
  # ============ 公共政策 ============
  - id: multi-streams
    name: 多源流理论
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 金登提出，问题流、政策流、政治流三条相对独立的溪流各自奔涌，唯有在“政策之窗”开启的瞬间由政策企业家汇合，议题才能从议程变成决策。
    key_points:
      - 三条源流并行运转而非依次接力，问题流靠指标、焦点事件与反馈打开，政策流里漂浮着“备好方案”，政治流由国民情绪、换届与利益格局构成。
      - 政策之窗由问题或政治开启，稍纵即逝，错过就要等待下一次。
      - 政策企业家的关键作用是在窗口打开前把方案磨好，窗口一开立即把三者“焊接”在一起。
    exam_relevance: 申论分析“热点事件为何能推动一项改革落地”的理论支撑；面试谈“机遇窗口”“提前谋划”时的高级引用。
    misconception: 多源流不是“三阶段论”——三条流是同时并行奔涌的，不是先有问题再找方案再谈政治的顺序过程。
    metaphor_hint: 汛期的渡口，三条河各自涨水，撑船人早已把船备好，只有三水交汇的那一刻才渡得过去。

  - id: punctuated-equilibrium
    name: 间断均衡理论
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 鲍姆加特纳与琼斯提出，政策长期被少数议题网络垄断而缓慢微调，一旦注意力转移、问题被重新“定义”，就会发生急促剧变——长期稳定与短期剧变交替出现。
    key_points:
      - 均衡期依靠议题垄断（把问题定义成地方性、技术性小事）维持。
      - 打破均衡的杠杆是“框架重构”，让问题升格为全国性、原则性争议，吸引新的行动者入场。
      - 对美国联邦预算数十年的研究是其经验基础，长平稳与急突变交替。
    exam_relevance: 分析“某项政策数十年不动、一朝根本转向”类材料题；理解注意力政治与舆情推动改革。
    misconception: 间断均衡不等于随机突变，也不是渐进主义的对立面那么简单——剧变背后是垄断结构被撬动。
    metaphor_hint: 一座沉默多年、被当作小土坡的火山，或一根被年年加压、突然崩断的旧板凳。

  - id: advocacy-coalition
    name: 倡议联盟框架
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 萨巴蒂尔提出，政策子系统内若干由共享信念体系绑定的联盟长期竞争，借助政策导向学习与外部事件冲击，在几十年尺度上争夺政策核心信念的主导权。
    key_points:
      - 信念分三层，深层价值几乎不变，政策核心难以撼动，次要方面可以妥协调整。
      - 联盟间通过“政策经纪人”协调交易，外部冲击（经济危机、灾难）是信念松动的主因。
      - 政策导向学习多发生在联盟内部，跨联盟学习只在核心信念受挫后发生。
    exam_relevance: 环保政策、医改等“多方长期博弈”类申论与面试素材；理解利益之争背后的信念之争。
    misconception: 它不是利益集团理论的翻版，纽带是“共享信念体系”而不只是利益算计。
    metaphor_hint: 两位医派宗师隔着瘟疫论战三十年，偶有合作、从不改宗，直到一场大疫撼动了各自的地基。

  - id: policy-window
    name: 政策之窗
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 议程与决策的短暂机会期，当问题、方案、政治三要素恰好齐备时窗口开启，转瞬即逝，错过只能等待下次。
    key_points:
      - 窗口可由问题（突发事件、指标恶化）开启，也可由政治（换届、国民情绪）开启。
      - 窗口期极短，“方案备好了才有资格等风来”。
      - 与多源流理论配套使用，是理解改革时机的关键概念。
    exam_relevance: 面试谈“抓住时机、提前准备”；申论论述改革为什么“宜早不宜迟、宜快不宜慢”。
    misconception: 窗口不是事件本身，而是问题、方案、政治三流耦合的机会，事件只是开窗的手。
    metaphor_hint: 只有涨潮时才出得了港的船，潮不等船，船必须先备好帆。

  - id: garbage-can
    name: 垃圾桶模型
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 科恩、马奇与奥尔森提出，组织决策是问题、方案、参与者、选择机会四股流的随机耦合，答案常常先于问题存在，恰巧相遇即成决策。
    key_points:
      - 适用于“有组织的无政府状态”，目标模糊、因果不清、参与者流动。
      - 决策带有高度偶然性，同一个组织在不同耦合下会给出完全不同的结果。
      - 解释了为什么许多会议“议而不决”，又偶有神来之笔。
    exam_relevance: 与理性决策模型对比的常识考点；面试谈会议效率、决策机制时的批判性视角。
    misconception: 不是说决策全靠运气，而是刻画理性边界之外组织决策的真实机理。
    metaphor_hint: 码头旧货市，四路人各带各的货各怀各的心思，恰巧碰头就成交一单。

  - id: policy-implementation-gap
    name: 政策执行偏差
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 政策目标与执行结果之间的系统性落差，表现为象征式执行、选择性执行、替代式执行、附加式执行等形态。
    key_points:
      - 成因链条：政策本身模糊、目标群体利益冲突、执行资源不足、监督问责缺位。
      - “上有政策、下有对策”是激励结构的产物，不能只归咎执行者素质。
      - 执行研究有自上而下与自下而上两派，前者盯中央控制，后者盯基层裁量。
    exam_relevance: 申论高频主题“政策落地的最后一公里”、基层治理、形式主义批判。
    misconception: 执行偏差不等于执行者偷懒，多数时候是制度性激励与政策设计的问题。
    metaphor_hint: 一道菜谱经五道转手，每人都“灵活掌握”一点，端上桌已换了味道。

  - id: policy-diffusion
    name: 政策扩散
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 一项政策创新随时间在政府间传播的过程，传播机制包括学习、模仿、竞争与强制，通常呈 S 形曲线。
    key_points:
      - 先行者承担试错成本，跟随者观望成败后快速跟进。
      - 扩散不是照搬，常伴随“本土化再发明”。
      - 中国的“试点—总结—推广”是政策扩散的典型制度安排。
    exam_relevance: 河长制、自贸区、“最多跑一次”等改革推广案例的分析框架。
    misconception: 扩散快不等于扩散好，跟随者可能只学到形式没学到机制。
    metaphor_hint: 一盏灯点亮一条街，邻居先是观望，接着打听，最后整条街都亮了。

  - id: policy-termination
    name: 政策终结
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 有意识地终止低效或过时的政策、项目与组织，并把资源转向新方向，是政策过程中最艰难的最后一环。
    key_points:
      - 终结方式包括废止、合并、剥离与渐进退出。
      - 反终结联盟（受益者、执行组织）往往比支持终结者更组织化。
      - 沉没成本、组织惯性、“再等等看”的心态是主要障碍。
    exam_relevance: 机构改革、清理“僵尸政策”、腾笼换鸟类论述题的理论视角。
    misconception: 终结不是失败，恰恰可能是政策过程成熟的表现——敢于止损也是治理能力。
    metaphor_hint: 老屋里那座没人再用的灶台，拆与留的拉锯，最后柴火都朽了灶还没动。

  - id: evidence-based-policy
    name: 循证决策
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 以严格证据（数据、实验、评估）而非直觉、惯例或表态作为政策依据，把“什么有效”建立在可检验的基础上。
    key_points:
      - 随机对照试验等方法进入公共政策，如各国行为洞察团队。
      - 证据有强弱分级，样本与因果识别是关键。
      - 循证不排斥价值判断，证据回答“什么有效”，政治回答“什么值得”。
    exam_relevance: “精准施策”“大数据治理”“科学决策”论述题的方法论支撑。
    misconception: 循证不等于唯数据论，数据有偏差，价值权衡不可被指标替代。
    metaphor_hint: 老船医不再全凭祖传偏方，而是把每一次用药和结果都记在册子上，年年翻晒。

  - id: policy-feedback
    name: 政策反馈效应
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 皮尔逊提出“政策制造政治”——政策一旦出台会反过来重塑利益格局、公众认知与制度能力，从而影响后续政策的走向。
    key_points:
      - 资源效应：政策养出受益者群体，他们组织起来捍卫政策。
      - 解释效应：政策改变民众对“什么是正常”的认知，如社保让人习惯国家兜底。
      - 老政策因此“积重难返”，改革是在给自己造的路径上开车。
    exam_relevance: 分析“为什么一项旧政策如此难改”，理解利益固化的政策根源。
    misconception: 政策反馈不等于政策评估，评估回头看效果，反馈看政策如何向前改写政治。
    metaphor_hint: 修好的水渠反过来决定村庄的形状，再想改渠，先得迁半个村。

  - id: incrementalism
    name: 渐进主义
    discipline: 公共政策
    difficulty: 进阶
    one_liner: 林德布洛姆提出，现实中的公共决策是在既有政策基础上做边际调整与相互妥协，“摸着石头过河”而非一步到位的最优设计。
    key_points:
      - 有限理性的现实策略：不追求全面理性，只比较少数熟悉方案。
      - 渐进降低冲突与风险，让各方在熟悉范围内谈判。
      - “连续有限比较”，政策是系列小步的总和。
    exam_relevance: 与完全理性决策模型对比的考点；评析“小步快跑”“试点推进”式改革。
    misconception: 渐进不等于保守拖延，它是约束条件下的策略性调适，必要时也会大步。
    metaphor_hint: 夜航水手不重画海图，只每次修正一小格舵，天亮时已绕过暗礁。

  - id: bounded-rationality
    name: 有限理性
    discipline: 公共政策
    difficulty: 研究生
    one_liner: 西蒙提出，人的理性受信息、认知与时间约束，因此追求“满意解”而非“最优解”，组织与惯例是理性的脚手架。
    key_points:
      - 满意化（satisficing）：找到“够好”的就停，不穷尽所有选项。
      - 搜索与计算本身有成本，理性是稀缺资源。
      - 1978 年诺贝尔经济学奖，是公共管理与行为决策的地基。
    exam_relevance: 行测常识（诺奖对应）；面试谈“允许试错”“不追求完美方案”时的理论根据。
    misconception: 有限理性不是“不理性”，而是理性在约束下的适应性形态。
    metaphor_hint: 山里采药人采到够用的一篓就下山，不发誓找遍全山最灵的那一株。

  # ============ 公共管理 ============
  - id: street-level-bureaucracy
    name: 街头官僚
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 利普斯基提出，警察、教师、窗口办事员等一线人员在资源、时间与规则的多重约束下，用自由裁量把抽象政策“翻译”成具体处置，他们的日常选择事实上就是政策本身。
    key_points:
      - 处于政策链条末端却握有事实上的政策制定权。
      - 面对超载需求与有限资源，发展出排队、配额、分类贴标签等“简化做法”以求生存。
      - 裁量既是服务灵活性的来源，也是偏差与不公的温床。
    exam_relevance: “基层减负”“窗口服务”“最后一公里”的申论理论支撑；面试答“政策执行走样”的深因。
    misconception: 街头官僚不指级别低的官僚，核心特征是“直接面对公民加拥有裁量空间”。
    metaphor_hint: 巷口发糖人，规则是那张图纸，勺子却握在他手里，勺子一歪，糖就变了份量。

  - id: representative-bureaucracy
    name: 代表性官僚制
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 官僚群体的社会构成（性别、地域、阶层等）若与被服务人口相似，其利益与视角更可能被代表——被动代表靠构成，主动代表还需裁量权。
    key_points:
      - 被动代表（构成相似）转向主动代表（行为倾斜）需两个条件：岗位有裁量空间、身份在决策中可见。
      - 对“价值中立的科层制”的补充，回应“谁来代表沉默多数”的问题。
      - 常用于解释基层干部本地化、女性干部配额等制度安排。
    exam_relevance: 干部队伍结构、民族地区治理、选调生制度等论述题的理论化表达。
    misconception: 不是任人唯亲，强调的是结构性代表而非私利输送。
    metaphor_hint: 评理的长老会里若没有一个渔夫，湖上的规矩永远只偏向种田人。

  - id: administrative-burden
    name: 行政负担
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 赫德与莫伊尼汉提出，公民与政府打交道时承受的学习成本、合规成本与心理成本——负担本身常常就是一项隐形政策，决定了谁真正享受得到福利。
    key_points:
      - 学习成本：弄清有没有、去哪办、怎么办；合规成本：材料、证明、跑腿；心理成本：被审查感、污名感。
      - “负担作为政策”：繁琐有时是被有意设计的门槛（筛掉“不合格”申请人）。
      - 减负担改革（一网通办、免申即享）本质是重新分配这些成本。
    exam_relevance: “减证便民”“最多跑一次”“免申即享”改革的理论解释，申论与面试双热点。
    misconception: 减负担不等于降标准，目标是减少摩擦而不是放松审核要求。
    metaphor_hint: 进山取水要过三道关卡，认路、办证、看脸色，水还是那瓢水，多数人渴死在半路。

  - id: goal-displacement
    name: 目标置换
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 默顿提出，组织把规则、程序等手段奉为目标本身，真正的目标反而被遗忘——守规矩取代了做成事。
    key_points:
      - 科层制“训练有素的无能”：对规则的忠诚内化为人格。
      - 手段本是仆人，久居其位反成主人。
      - 痕迹主义、为留痕而留痕是其当代形态。
    exam_relevance: 形式主义、痕迹主义批判类申论的核心理论；“放管服”改革的病理学依据。
    misconception: 不是个人失职，而是科层制的结构性病症，换人也难痊愈。
    metaphor_hint: 守桥人天天给桥上油，上油的手艺无可挑剔，直到桥塌了他还惦记着油壶。

  - id: parkinson-law
    name: 帕金森定律
    discipline: 公共管理
    difficulty: 基础
    one_liner: 帕金森戏言，官僚机构的雇员人数与实际工作量无关地自动膨胀——工作会填满可用的时间，官员倾向增加下属而非对手。
    key_points:
      - 两条机制：官员喜欢制造下属（分权风险小），互相制造工作（彼此添活）。
      - 委员会规模膨胀到一定程度后效率骤降，决策退化为签到与寒暄。
      - 1955 年由《经济学人》刊出的讽刺文章，是行政组织研究的经典玩笑。
    exam_relevance: 行测常识高频；机构编制改革、基层减负的申论素材。
    misconception: 不是“人多效率低”这么直白，核心是权力自保驱动的结构性膨胀。
    metaphor_hint: 每位将军都给自己配两名副官，副官又各配两名参谋，仗还没打，马队先排到地平线。

  - id: peter-principle
    name: 彼得原理
    discipline: 公共管理
    difficulty: 基础
    one_liner: 彼得戏言，层级组织中人人会被晋升到其不胜任的层级为止，久而久之各个岗位都被不胜任者占据。
    key_points:
      - 晋升依据是旧岗位的表现，而新旧岗位所需能力不同。
      - “到达不胜任高度”后停留，组织整体滑向平庸。
      - 讽刺的是，恰恰是优秀者被反复提拔制造了这一结局。
    exam_relevance: 行测常识；干部“能上不能下”、职务与职级并行等制度讨论的切入点。
    misconception: 不是说无能者才晋升，恰相反，是胜任者一路晋升直到掉进不胜任的坑。
    metaphor_hint: 全店最好的售货员被提成店长，从此店里少了个好售货员、多了个差店长。

  - id: iron-law-of-oligarchy
    name: 寡头铁律
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 米歇尔斯提出，任何大型组织迟早都会形成少数职业领导层的寡头统治，根源在专业技能垄断、沟通成本与大众的政治冷漠。
    key_points:
      - 组织规模扩大导致专业化与官僚化，领导层利益固化为“组织的存续”。
      - 即使最民主的政党与工会也难以幸免，故称“铁律”。
      - 领袖技能不可替代、大众依赖与感激，构成寡头化的三块基石。
    exam_relevance: 政治学常识；工会、行业协会、社团治理研究的经典框架。
    misconception: 不是阴谋论，而是结构性趋势的概括，小规模组织与轮换制度可部分缓解。
    metaphor_hint: 大船的舵无论如何设计，航行久了，总被同一间船长室握着。

  - id: bureaucratic-dysfunction
    name: 科层制反功能
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 默顿对韦伯理想类型的修正，科层制在产生效率的同时系统性地生产僵化、形式主义与人格畸变，正功能与反功能同源。
    key_points:
      - 非人格化既是公平的来源也是冷漠的来源。
      - 对规则的仪式化忠诚导致“训练有素的无能”。
      - 反功能不是副作用而是科层逻辑的必然产物。
    exam_relevance: “放管服”、整治形式主义的理论基础；申论谈制度与活力的平衡。
    misconception: 反功能不是可忽略的副作用，它与效率出自同一套机制，无法简单切除。
    metaphor_hint: 一副合身的盔甲，护你周全，也把你锁在原地的姿势里。

  - id: new-public-management
    name: 新公共管理
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 二十世纪八十年代起的全球行政改革浪潮，把市场机制、绩效合同、顾客导向引入公共部门，主张政府“掌舵而非划桨”。
    key_points:
      - 工具箱：民营化、绩效预算、目标管理、分权化、竞争性外包。
      - 标志实践：英国“下一步行动”方案、新西兰政府部门公司化改造。
      - 核心隐喻：把公民当“顾客”，把公民当“纳税人股东”。
    exam_relevance: 行测常识；“放管服”、绩效考核、政府购买服务论述题的理论源头。
    misconception: 常与新公共服务混淆，把公民仅仅当顾客正是后者批评的靶心。
    metaphor_hint: 老学馆改造成客栈来经营，账目清楚客人满意，只是有人问，那念书呢。

  - id: new-public-service
    name: 新公共服务
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 登哈特夫妇针对新公共管理提出的矫正，公民不是顾客而是权利主体，政府的职责是服务而非掌舵，民主价值高于效率。
    key_points:
      - “服务而非掌舵”，公共利益是对话协商的产物而非个人偏好的加总。
      - 重视公民权与公民参与胜过企业家精神。
      - 责任不是单一的绩效指标，而是法律、价值、政治与民意的多重复合。
    exam_relevance: 与新公共管理对比的论述题；全过程人民民主、协商治理的学理表达。
    misconception: 不是退回传统官僚制，而是价值坐标的更换——从效率到民主。
    metaphor_hint: 客栈老板娘把金字招牌摘下来，重新挂上“议事堂”的旧匾。

  - id: collaborative-governance
    name: 协同治理
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 政府与非政府主体（企业、社会组织、公民）通过制度化安排共同参与公共决策与执行，以共识为导向、以责任共担为特征。
    key_points:
      - 安塞尔与加什模型：起始条件、制度设计、领导力、协同过程四要素。
      - 共识规则不同于多数决，追求“都能接受”而非“多数赢”。
      - 政府角色从指挥者转为搭台者与担保人，但不卸责。
    exam_relevance: “共建共治共享”、社区议事会、枫桥经验等案例题的学理框架。
    misconception: 协同治理不等于政府甩锅外包，协同失败政府仍须担责。
    metaphor_hint: 一条黑水河的清理，上游镇、下游厂、渔民与驴友最终坐上同一条长凳。

  - id: holistic-governance
    name: 整体性治理
    discipline: 公共管理
    difficulty: 进阶
    one_liner: 希克斯与登力维提出，针对部门分割、职能碎片化的再整合——以公民需求为导向，协调政策、机构与流程，让政府“像一个整体”运作。
    key_points:
      - 逆碎片化：大部门制、一站式服务、跨部门信息共享。
      - 与新公共管理的分权化、合同化倾向相对，强调协调与整合。
      - 以结果与公民旅程为组织依据，而非以职能为依据。
    exam_relevance: “一网通办”“大部门制”“跨省通办”改革论述的理论表达。
    misconception: 不是机构越大越好，核心是协调机制而非规模。
    metaphor_hint: 患者抱着五张化验单跑遍五个科室，最后一位大夫把五张单子铺在同一张桌上。

  - id: meta-governance
    name: 元治理
    discipline: 公共管理
    difficulty: 研究生
    one_liner: “治理的治理”——政府通过制度设计、框架搭建、资源调配与价值协调来组织多元治理本身，管的是“游戏规则”而非每一步棋。
    key_points:
      - 治理同样会失灵（碎片、空洞、僵局），需要更高阶的协调。
      - 政府作为元治理者定规则、修平台、兜底线，但不事事亲为。
      - 杰索普、瑟伦森等人的理论，回应“治理失灵后向何处去”。
    exam_relevance: 前沿理论题；理解“党委领导、政府负责、社会协同、公众参与”的深层逻辑。
    misconception: 不是回归集权，而是在更高层级上做设计者与仲裁者。
    metaphor_hint: 众人下棋，他不执子，只定棋规、修棋盘、给输棋的人添一口热茶。

  - id: algorithmic-bureaucracy
    name: 算法官僚
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 算法与自动化系统开始承担裁量、分配与判断，成为“数字街头官僚”，效率与一致性的红利背后是偏见、黑箱与责任漂移。
    key_points:
      - 自动化裁量：评分、派单、预警由模型作出，人只按键。
      - 责任漂移：“是系统决定的”成为新的免责话术，形成裁量真空。
      - 训练数据携带历史偏见，算法把昨天的偏差写成明天的规则。
    exam_relevance: “算法治理”“数字政府”热点论述；面试谈健康码、大数据杀熟、自动化审批。
    misconception: 算法并不天然中立，它只是把人的既有判断固化并规模化。
    metaphor_hint: 巷口新来的机器判官读过全部旧案卷，却没见过任何一个活人。

  - id: public-value-failure
    name: 公共价值失灵
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 博兹曼提出，与市场失灵相对，公共组织未能兑现公共价值——包括实质失灵（没做成该做的事）、程序失灵（漠视公民权利与参与）与效率失灵。
    key_points:
      - 公共价值清单：代表性、平等、回应性、问责、廉洁、效率等。
      - 政府失灵不能只用市场失灵的补集来理解，需独立的分析维度。
      - 绩效评估与公众信任之间的落差即公共价值缺口。
    exam_relevance: “不作为乱作为”“重痕不重绩”现象的理论化表达；申论谈政府自身建设。
    misconception: 不只是“政府失灵”的另一种说法，它有明确的维度与判据。
    metaphor_hint: 庙里的钟照常鸣响，香客求的平安却无人应答，香火越旺，钟越空。

  - id: pressure-system
    name: 压力型体制
    discipline: 公共管理
    difficulty: 研究生
    one_liner: 荣敬本等学者概括，通过目标责任制、指标考核与“一票否决”层层加压，把任务自上而下传导至基层的动员体制。
    key_points:
      - 数字化指标层层加码，“县里 110，乡里 120，村里 130”。
      - 基层在硬指标与软资源夹缝中发展出策略性应对（材料政绩、数字达标）。
      - 与运动式治理互为表里，是理解中国基层运行的关键机制。
    exam_relevance: “层层加码”“基层减负”“痕迹主义”分析题的深层制度解释。
    misconception: 不是科层制本身，而是中国科层体系的一种动力机制，压力也可转化为执行力。
    metaphor_hint: 井绳上串着一排水桶，每一节绳子都委屈地说，我只是转述上面的话。

  # ============ 政治学与行政法 ============
  - id: weber-bureaucracy
    name: 韦伯科层制
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 韦伯的理想类型：以成文规则、层级节制、非人格化、专业分工与文书档案为基础的“合法—理性”支配组织，是现代国家的组织骨架。
    key_points:
      - 三种支配类型：传统型、魅力型、法理型，科层制是法理型的组织形态。
      - 非人格化保证“对事不对人”，也带来“对人不热情”。
      - 韦伯警告现代人身处“铁笼”——效率与自由的两难。
    exam_relevance: 行测常识；申论谈“规范执法”与“机械执法”的分寸、制度与温度。
    misconception: 科层制不是“官僚主义”的贬义词，它首先是现代组织的中性骨架，病症另算。
    metaphor_hint: 一座巨大的钟表，每个齿轮都分毫不差，整表却从不认识时间。

  - id: proportionality
    name: 比例原则
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 行政法的帝王条款：公权力干预私权利须满足目的正当、手段适当、必要性（最小侵害）与狭义均衡性，禁止“高射炮打蚊子”。
    key_points:
      - 三阶审查：适当性（能达目的）、必要性（损害最小）、均衡性（所得大于所失）。
      - 约束一切公权干预行为，不限于行政处罚。
      - 是“过罚相当”“合理行政”原则的操作化标准。
    exam_relevance: 行政法高频考点；执法方式、疫情管控措施等案例分析的标尺。
    misconception: 不只管罚款轻重，从强制手段到关停决定都受其约束。
    metaphor_hint: 药方与病，感冒不开虎狼之药，虎狼之症也不喂姜汤。

  - id: discretionary-power
    name: 行政自由裁量权
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 法律给行政主体在要件成就时于法定范围内选择行为方式、幅度与决定的权力——裁量不等于恣意，是“受约束的判断”。
    key_points:
      - 裁量空间受法律目的、平等对待、比例原则与程序约束。
      - 裁量收缩理论：个案越特殊，裁量空间越窄直至收缩为零。
      - “同案不同罚”是裁量失控的典型症状，裁量基准是驯服手段。
    exam_relevance: 行政执法类案例题；面试谈“温度执法”“首违不罚”的边界。
    misconception: 裁量不是“自由”裁量，行使不当同样构成违法或不当。
    metaphor_hint: 琴师指尖的自由，永远在曲谱之内，越界即成噪音。

  - id: due-process
    name: 正当程序原则
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 公权力作出不利决定须遵循最低限度的程序正义：事先告知、听取陈述申辩、说明理由、回避——程序正义独立于结果正确而存在。
    key_points:
      - “任何人不得做自己案件的法官”，回避是底线。
      - 程序是看得见的正义，程序违法即使结果无误仍属违法。
      - 听证、送达、说明理由是三大支柱。
    exam_relevance: 行政法程序考点；申论“程序与效率”“阳光执法”主题。
    misconception: 程序不是繁文缛节，而是正义的可见形式，省略程序的效率终将以信任偿还。
    metaphor_hint: 村里断案再急，也得让被告把话说完，再快的秤也要放平了再称。

  - id: principal-agent
    name: 委托代理理论
    discipline: 政治学与行政法
    difficulty: 研究生
    one_liner: 信息不对称下委托人授权代理人行动，因目标不一致与信息劣势，代理人的自利行为偏离委托人利益，产生道德风险与监督成本。
    key_points:
      - 三个要件：目标函数不一致、信息不对称、责任不可完全契约化。
      - 解法是激励相容设计，让说真话、干实事成为代理人的最优选择。
      - 公共领域链条更长：选民—议会—政府—部门—基层，层层委托层层代理。
    exam_relevance: 中央与地方、政府与国企、业主与物业等关系的分析框架；“信息壁垒”类申论。
    misconception: 不是管理学鸡汤，它有严格的模型内核与可检验推论。
    metaphor_hint: 财主请远房侄子管庄园，账本永远比庄园晚到一步，而庄园只有一本账。

  - id: regulatory-capture
    name: 规制俘获
    discipline: 政治学与行政法
    difficulty: 研究生
    one_liner: 斯蒂格勒与佩尔兹曼提出，被规制行业通过游说、信息优势与“旋转门”使规制者为其利益服务——规制者被被规制者俘获。
    key_points:
      - 需求侧解释：规制本身是被产业“购买”的产品。
      - 集中利益战胜分散大众：少数企业组织化，消费者一盘散沙。
      - 信息俘获：规制者依赖被规制企业提供数据与专业判断。
    exam_relevance: 反垄断、金融监管、行业“保护伞”案例的分析框架。
    misconception: 俘获多数时候合法且无形，不等于贪腐，一杯茶一场调研都可能是通道。
    metaphor_hint: 守夜人渐渐睡进了他看守的粮仓，钥匙还挂在他腰上。

  - id: rent-seeking
    name: 寻租
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 克鲁格与塔洛克提出，不创造新财富、通过影响分配规则攫取租金的活动（游说、争牌照、跑审批），其社会成本往往超过租金本身。
    key_points:
      - 与利润的区别：利润来自创造价值，租金来自改变规则。
      - 寻租成本包括贿赂之外的时间、人力与制度磨损。
      - 审批权、牌照、补贴资格是典型租金源。
    exam_relevance: “审批腐败”“跑部钱进”的经济学解释；营商环境类申论。
    misconception: 租金不是地租，寻租也不是正常的市场营销，判据在于是创造还是分利。
    metaphor_hint: 全村人不再种地，都排队争当那个“量地的人”。

  - id: tacitus-trap
    name: 塔西佗陷阱
    discipline: 政治学与行政法
    difficulty: 进阶
    one_liner: 当政府失去公信力，无论说真话还是假话、做好事还是坏事，都会被公众认为是在说假话、做坏事。
    key_points:
      - 语出塔西佗《历史》评述罗马皇帝的现代转述，并非原文定理。
      - 公信力是治理的隐形基础设施，平时看不见，塌时全塌。
      - 破局靠长期一致的行为与透明，而非一次漂亮的公关。
    exam_relevance: 面试高频；舆情处置、政务公开、“舆情次生灾害”案例分析。
    misconception: 不是塔西佗原文中的定理，是现代学者对公信力规律的概括。
    metaphor_hint: 自从那年钟楼报错一次时辰，每逢钟响，全村人都说，又骗我们去修谁的墙。

  # ============ 经济学 ============
  - id: public-goods
    name: 公共物品
    discipline: 经济学
    difficulty: 进阶
    one_liner: 同时具备非排他性与非竞争性的物品（国防、路灯、灯塔），人人都可享用且互不妨碍，市场因而供给不足，需公共提供。
    key_points:
      - 两大判据：非排他（拦不住不付钱的人）与非竞争（多一人享用零成本）。
      - 与“公共部门提供的东西”不是一回事，免费公交是准公共物品。
      - 判据决定供给方式：公共物品、俱乐部物品、共有资源谱系各不相同。
    exam_relevance: 行测经济常识经典考点；“基础设施”“基本公共服务”申论的理论地基。
    misconception: 公共提供的不等于公共物品，判据是物品属性而非提供者身份。
    metaphor_hint: 村口那盏没人愿意独自出钱、人人蹭亮的灯。

  - id: free-rider
    name: 搭便车
    discipline: 经济学
    difficulty: 进阶
    one_liner: 不付成本坐享他人提供的公共物品，导致集体供给不足——人人想蹭，灯就永远装不上。
    key_points:
      - 与公共物品孪生：非排他性使“不付钱也享用”成为理性选择。
      - 大团体更严重（奥尔森）：人越多，个体贡献越难被看见。
      - 解法：选择性激励（只奖贡献者）、强制征税、声誉与羞耻机制。
    exam_relevance: “众筹修路无人出钱”“业主群集体沉默”类申论与面试题。
    misconception: 搭便车者并非道德败坏，是激励结构使然，改结构比骂人有效。
    metaphor_hint: 乘凉总往别人栽的树下挤，挤着挤着，就再没人栽树了。

  - id: tragedy-of-commons
    name: 公地悲剧
    discipline: 经济学
    difficulty: 进阶
    one_liner: 哈丁1968年提出，产权不明的共有资源因个体理性地放牧、捕捞、排污而系统性耗竭——每个人都多养一只羊，直到草皮连根卷走。
    key_points:
      - 个体理性导致集体非理性，无人拥有“ saving 它”的收益权。
      - 三条出路：私有化、国家管制、用户自主治理。
      - 哈丁的原意更接近“开放获取”，产权不明才是病灶。
    exam_relevance: 草场退化、近海渔场枯竭、共享单车围城等案例；行测常识。
    misconception: 悲剧的根源不是“公有”本身，而是“人人有权用、无人负责养”的产权模糊。
    metaphor_hint: 每户都多养一只羊，羊越来越多，草越来越短，最后风把草原也吹走了。

  - id: commons-governance
    name: 公共池塘资源自主治理
    discipline: 经济学
    difficulty: 研究生
    one_liner: 奥斯特罗姆证明，介于市场与政府之间，用户社群凭清晰边界、集体选择、监测、分级制裁等八项设计原则，能够长期自治管理共有资源。
    key_points:
      - 2009 年诺贝尔经济学奖，终结了“公地悲剧必然发生”的宿命论。
      - 八项设计原则从数千个渔场、灌区、林地的实地研究中归纳。
      - 多中心治理：无需利维坦，也无需全盘私有化。
    exam_relevance: 行测常识（诺奖对应）；“村民自治”“河长制”“社区营造”论述的高级引用。
    misconception: 既不是私有化也不是国有化，是常被忽视的第三条道路。
    metaphor_hint: 同一条溪边八个村子立下的石碑，几时放水、谁来看闸、违规罚几担谷。

  - id: externality
    name: 外部性
    discipline: 经济学
    difficulty: 进阶
    one_liner: 经济活动对无关第三方产生的未通过价格反映的影响，负外部性（污染）导致过量生产，正外部性（疫苗、教育）导致供给不足。
    key_points:
      - 判据是“未通过市场价格反映”，被计入价格的不是外部性。
      - 庇古税矫正负外部性，补贴矫正正外部性。
      - 科斯定理：产权明晰且交易成本低时，当事双方可自行议价解决。
    exam_relevance: 碳排放权交易、垃圾分类激励、烟花禁放的经济学解释。
    misconception: 外部性不等于任何影响，必须是价格之外、强加于人的成本或收益。
    metaphor_hint: 邻家烟囱的烟，免费落进你晾的被子里，而洗被子的钱没人付。

  - id: natural-monopoly
    name: 自然垄断
    discipline: 经济学
    difficulty: 进阶
    one_liner: 规模经济使单一供给者成本最低的行业（电网、供水、铁路网），重复建设反而昂贵，问题从“要不要垄断”变为“如何规制垄断”。
    key_points:
      - 判据是平均成本随产量持续递减，管网类基础设施是典型。
      - 规制困境：定低价亏本、定高价伤民，还可能养出低效率。
      - 解法包括价格听证、特许经营、网运分离。
    exam_relevance: 公用事业改革、水电气价格听证的常识与申论背景。
    misconception: 自然垄断不等于“垄断皆坏”，把管网拆成三家竞争反而推高成本。
    metaphor_hint: 一条山涧只容得下一架水车，要争的不是谁架车，而是谁来定水价。

  - id: information-asymmetry
    name: 信息不对称
    discipline: 经济学
    difficulty: 进阶
    one_liner: 交易双方信息占有不均，催生逆向选择（事前）与道德风险（事后），阿克洛夫的“柠檬市场”证明劣品能把良品挤出市场。
    key_points:
      - 2001 年诺贝尔经济学奖（阿克洛夫、斯宾塞、斯蒂格利茨）。
      - 解法：信号发送（质保、品牌、学历）与信息甄别（体检、核保）。
      - 政务公开、信用体系的逻辑同样是压缩信息差。
    exam_relevance: 行测常识（诺奖对应）；“证明你妈是你妈”、数据壁垒类申论的理论视角。
    misconception: 信息不对称无法被消灭，只能被机制设计缓解。
    metaphor_hint: 旧马市上，卖家知道每匹马的脾气，买家只看得出毛色。

  - id: moral-hazard
    name: 道德风险
    discipline: 经济学
    difficulty: 进阶
    one_liner: 交易达成后的信息不对称——代理人因不必承担全部后果而改变行为：投保后粗心，获担保后冒进，有救助后躺平。
    key_points:
      - 与逆向选择的分界：逆向选择发生在签约前（隐藏信息），道德风险发生在签约后（隐藏行动）。
      - 解法是共担机制：免赔额、绩效挂钩、押金。
      - 医保、存款保险、政府兜底都需防道德风险设计。
    exam_relevance: 经济常识；医保骗保、金融刚性兑付案例的分析框架。
    misconception: 道德风险不是道德败坏，而是激励结构下的理性反应。
    metaphor_hint: 屋顶有人替他修的人，就不再急着补瓦。

  - id: adverse-selection
    name: 逆向选择
    discipline: 经济学
    difficulty: 进阶
    one_liner: 签约前的信息不对称，“差的把好的挤出市场”——柠檬市场、寿险挑出病最重的投保人、便宜删评的平台只剩差商家。
    key_points:
      - 阿克洛夫1970年《柠檬市场》：价格下降先赶走好卖家。
      - 逆向选择是均衡结果而非偶然现象，市场可能整个萎缩。
      - 解法：信号与甄别、强制信息披露、统一质量标准。
    exam_relevance: 常识考点；与“劣币驱逐良币”（格雷欣定律）的辨析是经典题型。
    misconception: 与道德风险的分界在时间：事前隐藏信息是逆向选择，事后隐藏行动是道德风险。
    metaphor_hint: 好苹果不肯降价，最后筐里只剩烂苹果，摊主还纳闷客人都去哪了。

  - id: niskanen-model
    name: 尼斯坎南模型
    discipline: 经济学
    difficulty: 研究生
    one_liner: 公共选择视角下的官僚行为模型：官僚是预算最大化者，凭借对成本信息的垄断，使部门预算膨胀到超过社会最优水平。
    key_points:
      - 官僚与拨款机构的双边垄断：官僚垄断议程与成本信息。
      - 预算被推到“总收益等于总成本”的规模，超过效率规模。
      - 改革含义：引入竞争性供给、绩效预算、日落条款。
    exam_relevance: “部门预算越砍越涨”的政治经济学解释；常识与申论均可落地。
    misconception: 官僚扩张不是为私贪腐，而是机构存续与声望的理性策略。
    metaphor_hint: 修庙的工匠年年报价，年年说，今年比去年需要更多彩绘。

  # ============ 公共选择与博弈论 ============
  - id: public-choice
    name: 公共选择理论
    discipline: 公共选择与博弈论
    difficulty: 研究生
    one_liner: 布坎南与塔洛克创立，用经济学方法研究政治——政治家、官僚、选民都是自利最大化者，“政治市场”同样需要机制设计。
    key_points:
      - 方法论个人主义与“经济人”假设移植到政治领域。
      - 政府失灵理论：政府干预未必校正市场，可能引入新的扭曲。
      - 1986 年诺贝尔经济学奖；立宪经济学主张先设计规则再博弈。
    exam_relevance: 行测常识（诺奖对应）；“公共政策为何偏离公共利益”的深层框架。
    misconception: 不是主张取消政府，而是提醒对政府权力同样需要约束的设计。
    metaphor_hint: 集市搬进舞池继续开张，只是选票替代了货币，汇率更加模糊。

  - id: arrow-impossibility
    name: 阿罗不可能定理
    discipline: 公共选择与博弈论
    difficulty: 研究生
    one_liner: 阿罗证明，在三人三选项以上时，不存在任何同时满足无约束域、帕累托原则、无关备选独立性与非独裁、且总能给出一致集体排序的社会选择规则。
    key_points:
      - 四个看似温和的条件合起来，唯一解是独裁——必须放弃其中一个。
      - 孔多塞投票悖论是其最小标本：两两多数决可以转出循环。
      - 1951 年《社会选择与个人价值》，1972 年诺贝尔经济学奖。
    exam_relevance: 诺奖常识；民主决策、议事规则、机制设计的深度论述与面试亮点。
    misconception: 定理不宣告“民主不可能”，它划定的是完美聚合的边界，现实民主靠程序与协商绕行。
    metaphor_hint: 三位乡贤三张字条，两两相比转圈、打分平手、加进一个垫底选项还能翻盘——怎么合都合不出一张“大家的总账”。

  - id: voting-paradox
    name: 孔多塞投票悖论
    discipline: 公共选择与博弈论
    difficulty: 进阶
    one_liner: 1785 年孔多塞发现，三个以上选项的两两多数决可以产生 A 胜 B、B 胜 C、C 又胜 A 的循环，集体偏好失去传递性。
    key_points:
      - 每个人都理性、诚实投票，集体结论仍自相矛盾。
      - 循环给议程设置者留下操纵空间：谁定比赛顺序，谁常能送方案过关。
      - 是阿罗不可能定理的最小例证。
    exam_relevance: 常识与逻辑题；面试谈议事规则、评审流程设计时的经典引用。
    misconception: 悖论与选民理性无关，恰是人人都理性才转出循环。
    metaphor_hint: 三个人两两掰手腕，人人都能赢一个，冠军却永远数不出来。

  - id: median-voter
    name: 中间选民定理
    discipline: 公共选择与博弈论
    difficulty: 进阶
    one_liner: 唐斯模型证明，两党竞争与单峰偏好下，均衡政策趋向中位选民的偏好——两党纲领向中间收拢直至几乎重合。
    key_points:
      - 前提是偏好单峰且议题单一维度，多维度议题下失效。
      - 解释了竞选纲领趋同、“向中间靠拢”的普遍现象。
      - 对“被忽略的极端”与“沉默的中间”提供了定位。
    exam_relevance: “竞选承诺趋同”类分析；理解多数决政治的引力中心。
    misconception: 定理不是普遍规律，前提破坏（多峰、多议题）结论即瓦解。
    metaphor_hint: 秋千架两边的孩子都往中间挪，最后停在中座孩子喜欢的那个高度。

  - id: prisoners-dilemma
    name: 囚徒困境
    discipline: 公共选择与博弈论
    difficulty: 进阶
    one_liner: 两个囚徒各自“理性”地选择背叛，结局却是双双判重刑——个体理性与集体理性的经典冲突。
    key_points:
      - 背叛是占优策略，（背叛，背叛）是纳什均衡，但劣于（合作，合作）。
      - 困境的根源是无法承诺与一次博弈。
      - 军备竞赛、环保减排、低价倾销、招标围猎都是其变体。
    exam_relevance: 行测常识高频；面试谈合作困境、协议监督、信任建设。
    misconception: 囚徒困境不等于所有博弈，它能演化为合作靠重复博弈与声誉。
    metaphor_hint: 两个分开关押的贩子各自聪明地先开口，出门才发现都替对方扛了全案。

  - id: nash-equilibrium
    name: 纳什均衡
    discipline: 公共选择与博弈论
    difficulty: 研究生
    one_liner: 任何一方单独改变策略都无法获益的策略组合——理性僵局的状态，未必是大家想要的结果。
    key_points:
      - 1950 年纳什证明有限博弈必存在（混合策略）均衡，1994 年诺贝尔奖。
      - 均衡不等于最优：囚徒困境的均衡恰是坏结局。
      - 多重均衡时需要协调机制（惯例、信号、承诺）。
    exam_relevance: 行测常识；博弈论题的判断基准，“僵局”“内卷”的学理表达。
    misconception: 纳什均衡不是商量好的最优方案，而是谁都不想单独跑的僵持点。
    metaphor_hint: 窄路上相向的两辆车，谁先让谁亏，于是都停着，一起亏。

  - id: collective-action-logic
    name: 集体行动的逻辑
    discipline: 公共选择与博弈论
    difficulty: 研究生
    one_liner: 奥尔森证明，大集团中理性个体不会自动为共同利益行动，除非有选择性激励或小集团结构——人多常常力量散。
    key_points:
      - 集团越大，个体贡献占比越小，搭便车激励越强。
      - 特权集团（小集团）与潜在集团（需激励动员）行为迥异。
      - “沉默的大多数”不是冷漠，是结构使然。
    exam_relevance: 业委会难产、行业协会失灵、志愿者动员类申论与面试。
    misconception: 不是“人多力量大”的反面鸡汤，而是可检验的组织激励理论。
    metaphor_hint: 全村凑钱修祠堂，人越多的村子越修不起来，小村反而修了三座。

  - id: repeated-game
    name: 重复博弈与声誉机制
    discipline: 公共选择与博弈论
    difficulty: 进阶
    one_liner: 同一博弈无限重复时，“未来的阴影”改变当下激励，合作可以在以牙还牙等策略下成为均衡——熟人市场不宰客的道理。
    key_points:
      - 无名氏定理：贴现因子足够大（足够在乎未来）时，合作可持续。
      - 一次性博弈倾向背叛：景区小店的“宰客经济学”。
      - 声誉机制需要信息流通——坏名声传得越快，合作越稳。
    exam_relevance: “熟人社会诚信”“信用体系建设”论述；面试谈长效机制。
    misconception: 重复博弈不会自动产生合作，需长期预期、信息透明与报复可信。
    metaphor_hint: 巷口百年老铺不敢宰客，街坊会记一辈子；景区小店今天不宰，明天再也见不到你。

  # ============ 社会学与行为科学 ============
  - id: nimby
    name: 邻避效应
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 居民认同垃圾焚烧厂、变电站等设施的社会必要性，却坚决反对建在自家后院——“别建在我家旁边”。
    key_points:
      - 风险与收益的空间错配：全社会受益，成本却压在周边。
      - 补偿机制、程序正义与信任水平决定“邻避”能否变“迎臂”。
      - 邻避冲突多是程序与信任问题，不只是利益问题。
    exam_relevance: 垃圾焚烧厂、殡仪馆、基站选址类申论与面试高频案例。
    misconception: 民众并非无理取闹，多数冲突源于被排除在决策之外。
    metaphor_hint: 人人都说教堂该修，只是别修在我家窗下，钟声最好远一点。

  - id: path-dependence
    name: 路径依赖
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 初始选择经由收益递增与转换成本自我强化，把制度锁进既定轨道——键盘布局、铁轨宽度、办事流程都可能被历史“锁死”。
    key_points:
      - 戴维与阿瑟的经典：QWERTY 键盘并非最优，只是先到且难换。
      - 报酬递增、网络效应、学习成本构成自我强化环。
      - 锁定不等于永不能改，需要外力冲击或临界点。
    exam_relevance: “积重难返”“去存量改革”分析；制度变迁类论述的标配概念。
    misconception: 路径依赖不宣扬宿命论，它指出的是改变的历史成本。
    metaphor_hint: 马车辙定了铁轨的宽度，铁轨定了隧道的大小，隧道定了火箭零件的运法。

  - id: matthew-effect
    name: 马太效应
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: 强者愈强、弱者愈弱的累积优势现象，语出《马太福音》，默顿引入科学社会学描述声誉与资源的集中。
    key_points:
      - 优势具有累积性：声誉带来资源，资源带来更多声誉。
      - 教育、区域发展、学术评价中普遍存在累积因果。
      - 制度干预（转移支付、普惠政策）可调节但难消除。
    exam_relevance: 教育公平、区域差距、“内卷”类申论；行测常识。
    misconception: 不必然走向绝对两极分化，它描述趋势而非铁定的终局。
    metaphor_hint: 谷仓里粮食越多的麻雀越容易抢到新粮，瘦麻雀连跳上梁的力气都没了。

  - id: broken-windows
    name: 破窗效应
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: 威尔逊与凯林提出，环境中的失序信号（破窗不修）会暗示“这里无人在意”，诱发更多失序与越轨行为。
    key_points:
      - 关键在“信号”：无人修复即无人看守。
      - 是零容忍警务的理论依据，也是其争议来源（成本与公平）。
      - 社区治理应用：及时修复小事，比严惩大恶更能维持秩序感。
    exam_relevance: 城市治理、社区治理申论；“小事不小”类面试题。
    misconception: 不是为严刑峻法背书，重点是及时修复信号、守住秩序感。
    metaphor_hint: 一扇没人修的窗，替整条街向破坏者发了请柬。

  - id: diffusion-of-responsibility
    name: 责任分散效应
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 责任人越多，个体感知的责任越小、行动越迟疑——旁观者效应，“人人负责”常常变成“人人不负责”。
    key_points:
      - 达利与拉塔内的紧急求助实验：旁观者越多，施救越慢。
      - 机制：责任稀释与“别人会做的”从众预期。
      - 组织中的九龙治水、踢皮球是同源病症。
    exam_relevance: “三个和尚没水吃”“九龙治水”类申论与面试；岗位职责设计。
    misconception: 不是人心冷漠，是心理机制与组织结构叠加的结果，定责到人是解药。
    metaphor_hint: 井台边站着十个人，都说等别人先去打水，日头落了井绳还挂着。

  - id: social-loafing
    name: 社会懈怠
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 集体劳动中个体付出的努力少于单独劳动——林格曼拉绳实验发现人越多人均出力越少，因为可搭便车且产出难以归因。
    key_points:
      - 源于产出不可识别与责任可稀释，与品德无关。
      - 解法：职责到人、成果可识别、小组规模控制。
      - “大锅饭养懒汉”的制度解释。
    exam_relevance: 团队管理、绩效考核类面试题；机关作风建设的学理支撑。
    misconception: 懒不一定是人品问题，匿名与不可归因才是元凶。
    metaphor_hint: 十个人拉一张大网，岸上的人只见网慢，看不见谁的手在松。

  - id: survivorship-bias
    name: 幸存者偏差
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: 只统计“活下来”的样本导致错误推断——二战统计学家沃德指出，该加固的是没有弹孔的部位，因为命中那些部位的飞机根本没能回来。
    key_points:
      - 样本选择性问题：沉默的失败者不在数据里。
      - “成功学”式归纳的通病：只访问赢家。
      - 政策评估要看流失样本、退出者、未申报者。
    exam_relevance: 行测与申论中批判“成功经验”式论证的利器。
    misconception: 不是全盘否定经验，而是要求先找到沉默的分母。
    metaphor_hint: 回来的老兵都夸那款军靴结实，没能回来的，没法投诉。

  - id: sunk-cost-fallacy
    name: 沉没成本谬误
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: 已投入且不可回收的成本不应影响当下的边际决策，但人常“为不浪费而继续浪费”——协和飞机效应。
    key_points:
      - 理性决策只看未来的成本与收益，过去的投入覆水难收。
      - 政府项目尤其难止损：停建等于承认错误，于是错上加错。
      - “半拉子工程”“烂尾项目”的行为经济学解释。
    exam_relevance: 决策类面试题；政府投资项目“止损”论述。
    misconception: 不看沉没成本不是鼓励半途而废，而是让决策回到未来。
    metaphor_hint: 船底漏了，船长说票钱都收了，继续开。

  - id: occams-razor
    name: 奥卡姆剃刀
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: “如无必要，勿增实体”——在解释力相同时选择假设更少的理论，十四世纪奥卡姆的威廉留下的方法论剃刀。
    key_points:
      - 是方法论偏好而非逻辑真理：简单不必然正确。
      - 适用前提是解释力相同，不能为求简而砍掉证据。
      - 行政与流程设计的镜像：“减证便民”“能合则合”。
    exam_relevance: 逻辑判断题的元原则；流程优化、“多证合一”论述的思维方式。
    misconception: 剃刀不是真理判据，是在证据打平时的默认偏好。
    metaphor_hint: 迷路时先怀疑自己拐错一个弯，而不是怀疑整座山挪了位置。

  - id: confirmation-bias
    name: 确认偏误
    discipline: 社会学与行为科学
    difficulty: 基础
    one_liner: 人倾向寻找、记住并相信符合既有信念的信息，对相反证据视而不见——先有结论，再找依据。
    key_points:
      - 沃森选择任务证明人擅长验证、拙于证伪。
      - 决策风险：调研沦为“为方案找支持”，论证变成回音壁。
      - 对抗手段：魔鬼代言人、红队评审、预注册承诺。
    exam_relevance: 行测逻辑；面试谈“兼听则明”“科学民主决策”的行为学支撑。
    misconception: 不是蠢人专属，越聪明越擅长自圆其说。
    metaphor_hint: 每人兜里都揣着一根听筒，只肯接到能传回自己声音的那口井里。

  - id: loss-aversion
    name: 损失厌恶
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 卡尼曼与特沃斯基的前景理论：等量损失带来的痛感约为等量收益快感的两倍，参照点不同，同一选择呈现不同面貌。
    key_points:
      - 2002 年诺贝尔经济学奖；“捡两百块才抵得上丢一百块”。
      - 框架效应：“九成存活率”与“一成死亡率”是同一件事。
      - 政策含义：改革阻力常来自“被拿走的”而不是“未得到的”。
    exam_relevance: 行测常识（诺奖对应）；改革攻坚、拆迁补偿沟通的策略依据。
    misconception: 损失厌恶不等于风险厌恶，人在损失域反而更爱冒险。
    metaphor_hint: 丢一百块的懊恼，要捡到两百块才能扯平——可谁都记得丢的那张。

  - id: giddens-paradox
    name: 吉登斯悖论
    discipline: 社会学与行为科学
    difficulty: 研究生
    one_liner: 吉登斯指出，气候变化的后果遥远、抽象、不可见，人们缺乏日常紧迫感；等灾害显形再行动则为时已晚——理性认知与行动意愿的错位。
    key_points:
      - 出自《气候变化的政治》，适用于一切“温水煮蛙”型风险。
      - 破局思路：让未来可见可感（指标、预警、保险、具象叙事）。
      - 与“邻避效应”“损失厌恶”合流，解释环境政策的大众阻力。
    exam_relevance: 生态文明、“双碳”论述的前沿视角；面试谈长期主义。
    misconception: 不限于气候变化，养老金、债务、生态透支都是同构问题。
    metaphor_hint: 座钟每天慢一分钟，没人肯修——直到某天全村误了唯一的那班火车。

  - id: nudging
    name: 助推
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 塞勒与桑斯坦提出，不禁止任何选项、不显著改变经济激励，通过改变选择架构（默认项、排序、提示）来引导人们的行为。
    key_points:
      - 自由家长主义：保留退出自由，只改默认与呈现。
      - 默认选项的强大：器官捐献“默认同意”的国家参与率天壤之别。
      - 各国“行为洞察团队”用助推降浪费、提参保、促储蓄。
    exam_relevance: “食堂摆盘减浪费”“默认电子账单”类案例；行为经济学常识。
    misconception: 助推不是强制，也不只是营销话术；被滥用的“暗黑模式”是它的反讽。
    metaphor_hint: 把水果摆到收银台边、把糖果撤下去——没人被拦，人人改了道。

  - id: social-capital
    name: 社会资本
    discipline: 社会学与行为科学
    difficulty: 进阶
    one_liner: 帕特南把社会网络、信任与互惠规范合称社会资本——“让民主运转起来”的润滑剂，也是降低治理成本的隐形资产。
    key_points:
      - 桥接型（跨群体联结）与黏合型（群体内部抱团）各有功能与风险。
      - 信任存量决定交易与治理成本：高信任社会办事成本低。
      - 社会资本可耗竭：失信一次，存量折损多年。
    exam_relevance: 社区治理、志愿服务、诚信建设类申论；“熟人社会”转型的分析工具。
    misconception: 不是“人脉关系学”，核心是普遍信任与公共互惠，而非私人关系网。
    metaphor_hint: 村里那口谁都能打的井，平日各家白打，大旱之年救活全村。
